name: Build APK (no secrets)

# Manual button, OR any push touching this workflow file.
# No GitHub Secrets needed. On success the APKs are also published to a
# public Release so they can be downloaded without authentication.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug = installable; release = R8-shrunk signed release build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    # 每次推送 main 都跑：这是唯一不需要 Secret 的工作流，所以它是唯一能稳定
    # 验证"代码能编译、单测能过"的 CI。之前只在工作流文件自身变更时触发，
    # 意味着普通代码提交根本不会被验证。
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        uses: ./.github/actions/release-signing
        with:
          key_pem_base64: ${{ secrets.RELEASE_SIGNING_KEY_PEM_BASE64 }}
          cert_pem_base64: ${{ secrets.RELEASE_SIGNING_CERT_PEM_BASE64 }}
          keystore_password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Run unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # 这个工作流不需要任何 Secret，所以它是唯一能在每次 push 上稳定跑起来的 CI。
          # 单元测试放在这里，保证提交进仓库的代码至少编译通过、逻辑测试通过，
          # 不会等到用户拿到 APK 才发现编不过。
          # carlife 的两个传输测试要绑定固定端口（7999 等），在 CI 容器里会互相抢端口，
          # 表现为与代码无关的偶发红灯，这里按测试类名模式排除。
          # 加引号：避免 shell 把 * 当通配符展开。
          ./gradlew \
            :shared:testDebugUnitTest \
            :carlife:testDebugUnitTest \
            "-PexcludeTestClasses=com.hpplay.carlife.transport.CarLifeWire*" \
            --stacktrace

      - name: Build APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          variant="${{ inputs.variant || 'debug' }}"
          echo "Building $variant"
          if [ "$variant" = "release" ]; then
            ./gradlew :mobile:assembleRelease :automotive:assembleRelease --stacktrace
          else
            ./gradlew :mobile:assembleDebug :automotive:assembleDebug --stacktrace
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p apk-out
          variant="${{ inputs.variant || 'debug' }}"
          if [ "$variant" = "release" ]; then dir=release; else dir=debug; fi
          for f in mobile/build/outputs/apk/$dir/*.apk; do
            [ -e "$f" ] && cp "$f" "apk-out/Hplay-mobile-$(basename "$f")"
          done
          for f in automotive/build/outputs/apk/$dir/*.apk; do
            [ -e "$f" ] && cp "$f" "apk-out/Hplay-automotive-$(basename "$f")"
          done
          ls -lh apk-out/

      - name: Verify signed APKs
        if: steps.signing.outputs.prepared == 'true'
        run: |
          set -euo pipefail
          # A release APK that is not signed cannot be installed, and an APK signed with the
          # wrong key cannot upgrade over the one already on the head unit. Print the signer
          # certificate of every APK so the fingerprint can be checked against the release key.
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          for apk in apk-out/*.apk; do
            echo "=== $(basename "$apk")"
            "${apksigner}" verify --verbose --print-certs "${apk}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hplay-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -E '^hplay\.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          vcode="$(grep -E '^hplay\.versionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          short_sha="${GITHUB_SHA:0:7}"
          variant="${{ inputs.variant || 'debug' }}"
          if [ "$variant" = "release" ]; then
            kind="release build (R8 shrunk + obfuscated)"
          else
            kind="debug build"
          fi
          notes="Version ${version} (versionCode ${vcode}), ${kind}, built from commit ${short_sha}. Signed with the Hplay release key, so it installs directly and upgrades over previous versions. MFi credentials are NOT included: CarPlay's built-in MFi target reports the credential as missing, while the CarLink and CarLife channels are unaffected."

          # 1) 先按版本号建一个永久 tag，把这一版的历史留住。
          #    少了它的话，apk-latest 被覆盖后旧版本的 APK 就再也找不回来了。
          #    注意：gh release create **只建 Release 不会带资产**，上传必须单独做，
          #    新建和已存在两条路径都要上传，否则会留下一个 0 资产的空 Release。
          version_tag="v${version}"
          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "Release $version_tag already exists, replacing its assets"
          else
            gh release create "$version_tag" \
              --title "Hplay ${version} APK" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$version_tag" apk-out/*.apk --clobber

          # 2) 再更新滚动 tag apk-latest（永远指向最新版）。
          if gh release view "apk-latest" >/dev/null 2>&1; then
            echo "Release apk-latest already exists, refreshing assets"
            gh release edit "apk-latest" --title "Hplay ${version} APK" --notes "$notes" --target "$GITHUB_SHA" || \
              echo "warning: could not update apk-latest metadata"
          else
            gh release create "apk-latest" \
              --title "Hplay ${version} APK" --notes "$notes" --target "$GITHUB_SHA"
          fi

          # 3) 上传放在删除之前：--clobber 只能覆盖同名文件，所以旧版本的资产会原地留下，
          #    留着它们的话 Release 上会同时挂着两个版本，下载脚本会把两套都拉下来，
          #    用户很容易装错版本。删掉旧的，只留本次构建的。
          gh release upload "apk-latest" apk-out/*.apk --clobber
          old_assets="$(gh release view "apk-latest" --json assets --jq '.assets[].name' || true)"
          for old in $old_assets; do
            case "$old" in
              *.apk)
                keep=no
                for cur in apk-out/*.apk; do
                  if [ "$(basename "$cur")" = "$old" ]; then
                    keep=yes
                  fi
                done
                if [ "$keep" = "no" ]; then
                  echo "  removing stale asset: $old"
                  gh release delete-asset "apk-latest" "$old" -y || echo "  warning: could not remove $old"
                fi
                ;;
            esac
          done
