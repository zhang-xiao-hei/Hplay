name: Build APK (no secrets)

# Manual button, OR any push touching this workflow file.
# No GitHub Secrets needed. On success the APKs are also published to a
# public Release so they can be downloaded without authentication.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug = installable; release = unsigned"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    # 每次推送 main 都跑：这是唯一不需要 Secret 的工作流，所以它是唯一能稳定
    # 验证"代码能编译、单测能过"的 CI。之前只在工作流文件自身变更时触发，
    # 意味着普通代码提交根本不会被验证。
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # 这个工作流不需要任何 Secret，所以它是唯一能在每次 push 上稳定跑起来的 CI。
          # 单元测试放在这里，保证提交进仓库的代码至少编译通过、逻辑测试通过，
          # 不会等到用户拿到 APK 才发现编不过。
          # carlife 的两个传输测试要绑定固定端口（7999 等），在 CI 容器里会互相抢端口，
          # 表现为与代码无关的偶发红灯，这里按测试类名模式排除。
          # 加引号：避免 shell 把 * 当通配符展开。
          ./gradlew \
            :shared:testDebugUnitTest \
            :carlife:testDebugUnitTest \
            "-PexcludeTestClasses=com.hpplay.carlife.transport.CarLifeWire*" \
            --stacktrace

      - name: Build APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          variant="${{ inputs.variant || 'debug' }}"
          echo "Building $variant"
          if [ "$variant" = "release" ]; then
            ./gradlew :mobile:assembleRelease :automotive:assembleRelease --stacktrace
          else
            ./gradlew :mobile:assembleDebug :automotive:assembleDebug --stacktrace
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p apk-out
          variant="${{ inputs.variant || 'debug' }}"
          if [ "$variant" = "release" ]; then dir=release; else dir=debug; fi
          for f in mobile/build/outputs/apk/$dir/*.apk; do
            [ -e "$f" ] && cp "$f" "apk-out/Hplay-mobile-$(basename "$f")"
          done
          for f in automotive/build/outputs/apk/$dir/*.apk; do
            [ -e "$f" ] && cp "$f" "apk-out/Hplay-automotive-$(basename "$f")"
          done
          ls -lh apk-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hplay-apk
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="apk-latest"
          version="$(grep -E '^hplay\.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          vcode="$(grep -E '^hplay\.versionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          short_sha="${GITHUB_SHA:0:7}"
          notes="Version ${version} (versionCode ${vcode}), built from commit ${short_sha}. \
          The debug APK is signed with the debug key and can be installed directly. \
          MFi credentials are NOT included."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, refreshing assets"
            # 换版本号后旧的 .apk 资产会留在 Release 里：--clobber 只能覆盖**同名**文件，
            # 新旧版本文件名不同，旧文件不会被替换。留着它们的话，下载脚本会把两个版本
            # 一起拉下来，用户很容易装错版本 —— 所以先删掉全部旧 APK，只留本次构建的。
            old_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' || true)"
            for old in $old_assets; do
              case "$old" in
                *.apk)
                  echo "  removing stale asset: $old"
                  gh release delete-asset "$tag" "$old" -y
                  ;;
              esac
            done
            gh release edit "$tag" --title "Hplay ${version} APK" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --title "Hplay ${version} APK" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" apk-out/*.apk --clobber
